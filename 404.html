<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Liam James Taylor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f5f5f0;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error {
      text-align: center;
      padding: 2rem;
    }
    .error h1 {
      font-family: 'Space Mono', monospace;
      font-size: 6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #5a7247;
    }
    .error p {
      font-size: 1rem;
      color: #888;
      margin-top: 1rem;
    }
    .error a {
      display: inline-block;
      margin-top: 2rem;
      color: #f5f5f0;
      text-decoration: none;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 1px solid #333;
      padding-bottom: 0.25rem;
      transition: border-color 0.3s;
    }
    .error a:hover { border-bottom-color: #f5f5f0; }
  </style>
</head>
<body>
  <div class="error">
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <a href="/">← go back to the start</a>
  </div>
</body>
</html>
